<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Nullwave rail</title>
<style>
@font-face{font-family:"Figtree";src:url(../wallpaper/fonts/figtree-latin.woff2) format("woff2");font-weight:300 900}
:root{--ink:#0f0a1e;--ink2:#181129;--ink3:#241838;--paper:#f3eefa;--paper2:#a9a8c2;--paper3:#66658a;--paper4:#33324d;--teal:#22e6d4;--pink:#ff3ea5;--purple:#9b4dff;--hair:rgba(243,238,250,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;user-select:none;font-family:"Figtree","Segoe UI",sans-serif;color:var(--paper);background:#0f0a1e}
/* the rail is laid out 64 px wide and scaled to the real window width, so it looks the same on every DPI */
#rail{position:fixed;left:0;top:0;width:64px;height:100vh;transform-origin:0 0;background:linear-gradient(180deg,rgba(15,10,30,.97),rgba(15,10,30,.97) 70%,rgba(36,16,52,.97));border-right:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;padding:12px 0 0}
.logo{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#22e6d4,#9b4dff 55%,#ff3ea5);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 18px rgba(155,77,255,.35)}
.logo:hover{transform:scale(1.07);box-shadow:0 6px 24px rgba(255,62,165,.5)}
.logo svg{width:26px;height:26px}
.sep{width:26px;height:1px;background:rgba(243,238,250,.18);margin:8px 0;flex:none}
/* shell buttons (Start, search, task view, network, volume): line icons in the rail's colours */
.ib{width:40px;height:30px;border-radius:9px;border:none;background:transparent;color:var(--paper2);cursor:pointer;display:grid;place-items:center;flex:none;transition:background .15s,color .15s}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ib:hover{background:var(--ink3);color:var(--teal)}
.ib:active svg{transform:scale(.88)}
.ib.s{width:26px;height:26px;border-radius:8px}
.ib.s svg{width:16px;height:16px}
.ib.off{color:var(--pink)}
.top{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:8px;flex:none}
.pair{display:flex;gap:2px;flex:none;margin-bottom:6px}
#bStart:hover{color:var(--purple)}#bSearch:hover{color:var(--teal)}#bTask:hover{color:var(--pink)}
.desk{width:100%;height:9px;flex:none;margin-top:8px;border-top:1px solid var(--hair);cursor:pointer;transition:background .15s}
.desk:hover{background:linear-gradient(90deg,var(--teal),var(--purple) 55%,var(--pink))}
.apps{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;overflow-y:auto;scrollbar-width:none}
.app{position:relative;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s}
.app:hover{background:var(--ink3)}
.app img{width:28px;height:28px;object-fit:contain;transition:transform .12s,opacity .2s,filter .2s}
.app img:not([src]){visibility:hidden}
.app:active img{transform:scale(.88)}
/* state: not running = dimmed icon; running = tile + bar on the screen edge; active = bright tile + long teal bar; minimized = hollow bar */
.app::before{content:"";position:absolute;left:-9px;top:50%;width:4px;height:0;border-radius:0 3px 3px 0;background:var(--paper2);transform:translateY(-50%);transition:height .2s,background .2s}
.app.run{background:rgba(243,238,250,.07)}
.app.run:hover{background:var(--ink3)}
.app.run::before{height:14px}
.app.run.min::before{background:transparent;border:1.5px solid var(--paper3);border-left:none;width:3px}
.app.act{background:rgba(34,230,212,.16);box-shadow:inset 0 0 0 1px rgba(34,230,212,.35)}
.app.act::before{height:30px;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.app:not(.run) img{opacity:.42;filter:grayscale(.6)}
.app:not(.run):hover img{opacity:.9;filter:none}
.app.min img{opacity:.7}
.gap{width:22px;height:1px;background:rgba(243,238,250,.16);margin:5px 0;flex:none}
.app .n{position:absolute;right:3px;top:3px;min-width:15px;height:15px;border-radius:8px;background:var(--purple);font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.tip{position:fixed;left:62px;padding:6px 10px;border-radius:8px;background:var(--ink2);border:1px solid rgba(243,238,250,.16);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;max-width:400px;overflow:hidden;text-overflow:ellipsis}
.leds{display:flex;gap:6px;margin:8px 0;flex:none}
.leds i{width:6px;height:6px;border-radius:50%;background:var(--paper4)}
.leds i.ok{background:var(--teal);box-shadow:0 0 7px var(--teal)}
.leds i.bad{background:var(--pink);box-shadow:0 0 7px var(--pink);animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.3}}
.tray{width:40px;height:30px;border-radius:9px;border:1px solid var(--hair);background:transparent;color:var(--paper2);font:inherit;font-size:16px;cursor:pointer;flex:none;margin-bottom:4px;height:22px;line-height:1}
.tray:hover{border-color:var(--teal);color:var(--teal)}
.clock{font-family:Bahnschrift,"Arial Narrow",sans-serif;font-size:22px;font-weight:600;line-height:1;text-align:center;flex:none;cursor:pointer;padding:5px 8px;border-radius:10px;transition:background .15s,color .15s}
.clock:hover{background:var(--ink3);color:var(--teal)}
.clock small{display:block;font-family:Consolas,monospace;font-size:9px;font-weight:400;color:var(--paper3);letter-spacing:.08em;margin-top:5px}
</style>
</head>
<body>
<div id="rail">
<div class="logo" id="logo" title="Spouštěč (Alt+Mezerník)"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="#0f0a1e" stroke-width="3"/><path d="M6 26L26 6" stroke="#0f0a1e" stroke-width="3" stroke-linecap="round"/></svg></div>
<div class="top">
  <button class="ib" id="bStart" data-sys="start" title="Nabídka Start"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/></svg></button>
  <button class="ib" id="bSearch" data-sys="search" title="Hledat (Win+S)"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
  <button class="ib" id="bTask" data-sys="taskview" title="Zobrazení úloh (Win+Tab)"><svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="12" height="10" rx="1.6"/><path d="M8 4h11a1.5 1.5 0 0 1 1.5 1.5V14"/></svg></button>
</div>
<div class="sep"></div>
<div class="apps" id="apps"></div>
<div class="leds" id="leds" title="trader · kamera · trader host"><i></i><i></i><i></i></div>
<button class="tray" id="tray" title="Ikony v oznamovací oblasti">⋯</button>
<div class="pair">
  <button class="ib s" id="bNet" data-sys="quick" title="Síť a rychlé nastavení (Win+A)"><svg viewBox="0 0 24 24" id="netSvg"><path d="M3 9.5a13 13 0 0 1 18 0"/><path d="M6.2 13a8.5 8.5 0 0 1 11.6 0"/><path d="M9.4 16.4a4 4 0 0 1 5.2 0"/><circle cx="12" cy="19.4" r=".6"/><path id="netX" d="M4 4l16 16" style="display:none"/></svg></button>
  <button class="ib s" id="bVol" data-sys="quick" title="Hlasitost: kolečko mění hlasitost, prostřední tlačítko ztlumí, klik otevře rychlé nastavení"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></svg></button>
</div>
<div class="clock" id="clock" data-sys="notif" title="Oznámení a kalendář (Win+N)">--<br>--<small>--</small></div>
<div class="desk" id="desk" data-sys="desktop" title="Zobrazit plochu (Win+D)"></div>
</div>
<script>
const $=(i)=>document.getElementById(i);
// ---- fit: 64 layout px = the whole window width, whatever scale Windows / Chromium picked ----
function fit(){
  const z=innerWidth/64, el=$('rail');
  if(!(z>0)) return;
  el.style.transform=Math.abs(z-1)<.02?'':`scale(${z})`;
  el.style.height=(innerHeight/z)+'px';
  try{ rail.metrics({iw:innerWidth,ih:innerHeight,dpr:devicePixelRatio,z:+z.toFixed(3)}); }catch(e){}
}
addEventListener('resize',fit); fit();

// ---- apps: keyed update, elements are reused so nothing flickers and hover survives ----
const els=new Map();
function make(i){
  const el=document.createElement('div');
  if(i.sep){ el.className='gap'; return el; }
  el.dataset.k=i.key; el.appendChild(document.createElement('img')).draggable=false;
  return el;
}
function update(u){
  const box=$('apps'), seen=new Set();
  u.items.forEach((i,n)=>{
    seen.add(i.key);
    let el=els.get(i.key); if(!el){ el=make(i); els.set(i.key,el); }
    if(!i.sep){
      const cls='app'+(i.pin?' pin':'')+(i.run?' run':'')+(i.act?' act':'')+(i.min?' min':'');
      if(el.className!==cls) el.className=cls;
      if(el.title!==(i.title||'')) el.title=i.title||'';
      const img=el.firstChild;
      if(i.icon){ if(img.getAttribute('src')!==i.icon) img.src=i.icon; } else if(img.hasAttribute('src')) img.removeAttribute('src');
      let b=el.querySelector('.n');
      if(i.n>1){ if(!b){ b=document.createElement('span'); b.className='n'; el.appendChild(b); } if(b.textContent!==String(i.n)) b.textContent=i.n; }
      else if(b) b.remove();
    }
    if(box.children[n]!==el) box.insertBefore(el,box.children[n]||null);
  });
  for(const [k,el] of els) if(!seen.has(k)){ el.remove(); els.delete(k); }
  const L=$('leds').children, s=u.status||{};
  ['trader','cam','traderhost'].forEach((k,n)=>{ const c=s[k]===true?'ok':s[k]===false?'bad':''; if(L[n].className!==c) L[n].className=c; });
  $('tray').style.display=u.primary?'':'none';
}
rail.onUpdate((u)=>{ try{ update(u); if(u.status&&u.status.net) net(u.status.net); }catch(e){ console.error(e); } });
const keyOf=(e)=>{ const a=e.target.closest('.app'); return a?a.dataset.k:null; };
$('apps').addEventListener('click',(e)=>{ const k=keyOf(e); if(k) rail.click(k,'left'); });
$('apps').addEventListener('mousedown',(e)=>{ if(e.button===1) e.preventDefault(); });   // no auto-scroll cursor
$('apps').addEventListener('auxclick',(e)=>{ const k=keyOf(e); if(k&&e.button===1) rail.click(k,'middle'); });
addEventListener('contextmenu',(e)=>{ e.preventDefault(); const k=keyOf(e); if(k) rail.click(k,'context'); });
$('logo').onclick=()=>rail.launcher();
// shell buttons: every element with data-sys asks the app for that Windows feature
document.querySelectorAll('[data-sys]').forEach((b)=>b.addEventListener('click',()=>rail.sys(b.dataset.sys)));
// volume: wheel = up / down (Windows shows its own indicator), middle button = mute
let volAt=0;
$('bVol').addEventListener('wheel',(e)=>{ e.preventDefault(); const n=Date.now(); if(n-volAt<45) return; volAt=n; rail.sys(e.deltaY<0?'volup':'voldown'); },{passive:false});
$('bVol').addEventListener('mousedown',(e)=>{ if(e.button===1) e.preventDefault(); });
$('bVol').addEventListener('auxclick',(e)=>{ if(e.button===1) rail.sys('mute'); });
// network: on-line / off-line as the browser engine sees it
// network icon: kind of connection from the main process (LAN cable / Wi-Fi / none), like the Windows tray
const NET_ICONS={
  lan:'<rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M8 15v2M12 15v2M16 15v2M7 20h10M12 17v3"/><path d="M8 8h8M8 11h5"/>',
  wifi:'<path d="M3 9.5a13 13 0 0 1 18 0"/><path d="M6.2 13a8.5 8.5 0 0 1 11.6 0"/><path d="M9.4 16.4a4 4 0 0 1 5.2 0"/><circle cx="12" cy="19.4" r=".6"/>',
  off:'<rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M8 15v2M12 15v2M16 15v2M7 20h10M12 17v3"/><path d="M3 3l18 18"/>'};
let netNow='';
function net(kind){ kind=kind||(navigator.onLine?'lan':'off'); if(kind===netNow) return; netNow=kind;
  $('netSvg').innerHTML=NET_ICONS[kind]||NET_ICONS.off; $('bNet').classList.toggle('off',kind==='off');
  $('bNet').title=(kind==='lan'?'Síť: kabel (LAN)':kind==='wifi'?'Síť: Wi-Fi':'Síť: odpojeno')+' · rychlé nastavení (Win+A)'; }
addEventListener('offline',()=>net('off'));
$('tray').onclick=()=>{ const r=$('tray').getBoundingClientRect(); rail.tray((r.bottom+6)/innerHeight); };
function clock(){ const d=new Date(); const t=String(d.getHours()).padStart(2,'0')+'<br>'+String(d.getMinutes()).padStart(2,'0')+`<small>${d.getDate()}. ${d.getMonth()+1}.</small>`; if($('clock').innerHTML!==t) $('clock').innerHTML=t; }
clock(); setInterval(clock,5000);
</script>
</body>
</html>
