<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Nullwave · heslo TP-Linku</title>
<style>
@font-face{font-family:"Figtree";src:url(../wallpaper/fonts/figtree-latin.woff2) format("woff2");font-weight:300 900}
@font-face{font-family:"Figtree";src:url(../wallpaper/fonts/figtree-latin-ext.woff2) format("woff2");font-weight:300 900;unicode-range:U+0100-02AF}
:root{--ink:#0f0a1e;--ink2:#181129;--ink3:#241838;--paper:#f3eefa;--paper2:#a9a8c2;--paper3:#66658a;--teal:#22e6d4;--pink:#ff3ea5;--purple:#9b4dff;--hair:rgba(243,238,250,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:"Figtree","Segoe UI",sans-serif;user-select:none}
body{padding:22px 24px;display:flex;flex-direction:column;gap:12px}
body::before{content:"";position:fixed;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--teal),var(--purple) 55%,var(--pink))}
h1{font-size:17px;font-weight:800}
p{font-size:12.5px;line-height:1.45;color:var(--paper2)}
p b{color:var(--paper);font-weight:600}
input{width:100%;font:inherit;font-size:15px;color:var(--paper);background:var(--ink2);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;outline:none}
input:focus{border-color:var(--teal)}
.row{display:flex;gap:8px;margin-top:auto}
button{font:inherit;font-size:13px;font-weight:700;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--hair);background:transparent;color:var(--paper2)}
button:hover{border-color:var(--teal);color:var(--teal)}
button.go{background:var(--teal);border-color:var(--teal);color:var(--ink);margin-left:auto}
button.go:hover{background:var(--paper);border-color:var(--paper);color:var(--ink)}
#msg{font-size:12px;min-height:16px;color:var(--teal)}
#msg.err{color:var(--pink)}
</style>
</head>
<body>
<h1>Heslo TP-Linku</h1>
<p id="info">Načítám…</p>
<input id="pw" type="password" placeholder="heslo správce přepínače" autocomplete="off" spellcheck="false">
<div id="msg"></div>
<div class="row">
  <button id="del" title="Smaže uložené heslo, widget Porty přestane číst přepínač">Smazat heslo</button>
  <button id="cancel">Zavřít</button>
  <button class="go" id="save">Uložit</button>
</div>
<script>
const $=(i)=>document.getElementById(i);
function show(i){
  if(!i||!i.ok){ $('info').textContent=(i&&i.error)||'Widget Porty není k dispozici.'; return; }
  $('info').innerHTML=`Přepínač <b></b>, uživatel <b></b>. `+(i.has?'Heslo je uložené.':'Heslo zatím není uložené.')+' '+
    (i.canEncrypt?'Ukládá se šifrovaně jen v tomto PC (Windows DPAPI) a posílá se pouze přepínači.':'Šifrování není k dispozici, heslo zůstane jen v paměti do ukončení Nullwave.');
  const b=$('info').querySelectorAll('b'); b[0].textContent=i.host; b[1].textContent=i.username;
}
function say(t,err){ $('msg').textContent=t; $('msg').className=err?'err':''; }
async function save(v){
  const r=await tlpass.set(v);
  if(!r||!r.ok) return say((r&&r.error)||'Nepodařilo se uložit.',true);
  $('pw').value=''; show(r); say(v?'Uloženo. Widget se připojuje.':'Heslo smazáno.');
  if(v) setTimeout(()=>tlpass.close(),900);
}
$('save').onclick=()=>{ const v=$('pw').value; if(!v) return say('Napiš heslo.',true); save(v); };
$('del').onclick=()=>save('');
$('cancel').onclick=()=>tlpass.close();
addEventListener('keydown',(e)=>{ if(e.key==='Enter') $('save').click(); if(e.key==='Escape') tlpass.close(); });
tlpass.info().then(show); $('pw').focus();
</script>
</body>
</html>
