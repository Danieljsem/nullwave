<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e6d4"/><stop offset=".55" stop-color="#9b4dff"/><stop offset="1" stop-color="#ff3ea5"/>
    </linearGradient>
    <radialGradient id="bg" cx=".3" cy=".2" r="1">
      <stop offset="0" stop-color="#2a1a4a"/><stop offset=".6" stop-color="#140d28"/><stop offset="1" stop-color="#0b0716"/>
    </radialGradient>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e6d4" stop-opacity="0"/><stop offset="1" stop-color="#22e6d4" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="c"><circle cx="128" cy="128" r="70"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/>
  <!-- radar sweep -->
  <path d="M128 128 L128 58 A70 70 0 0 1 188.6 93 Z" fill="url(#sw)" clip-path="url(#c)"/>
  <!-- sunset lines inside lower half -->
  <g clip-path="url(#c)" stroke="#ff3ea5" stroke-opacity=".55" stroke-width="5">
    <line x1="40" y1="150" x2="216" y2="150"/><line x1="40" y1="166" x2="216" y2="166" stroke-width="4"/><line x1="40" y1="180" x2="216" y2="180" stroke-width="3"/>
  </g>
  <!-- null ring + slash -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#g)" stroke-width="20"/>
  <line x1="66" y1="190" x2="190" y2="66" stroke="url(#g)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="171" cy="94" r="9" fill="#ff3ea5"/>
</svg>
